org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Configuration-on-demand: only the projects required by the requested tasks are
# configured. This lets `./gradlew :engine:test` run without configuring (and
# thus without resolving the Android Gradle Plugin for) the `:app` module, so
# the engine is buildable in environments where Google Maven is unreachable.
org.gradle.configureondemand=true

# Android (used only when the :app module is configured)
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
