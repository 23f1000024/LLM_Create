name: Android CI

# Builds run on GitHub-hosted Ubuntu runners, which ship the Android SDK and can
# reach Google's Maven — so the APK that cannot be produced in the authoring
# sandbox is built and uploaded here as a downloadable artifact.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: # lets you trigger a build manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run engine tests
        run: ./gradlew :engine:test --no-daemon
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-report
          path: engine/build/reports/tests/test
          if-no-files-found: ignore

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: engine-tests
    permissions:
      contents: write # needed to publish the APK as a GitHub Release asset
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee /tmp/build.log || {
            echo "::group::Kotlin compile errors";
            grep -E "^e: " /tmp/build.log || echo "(no 'e:' lines found)";
            echo "::endgroup::";
            exit 1;
          }
      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/uno-p2p-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uno-p2p-debug-apk
          path: dist/uno-p2p-debug.apk
          if-no-files-found: error
      # Publish the APK to a rolling GitHub Release so it is downloadable from the
      # Releases tab without signing in (artifacts require a login). Only from the
      # dev branch, to avoid creating releases from feature branches / PRs.
      - name: Publish APK to a GitHub Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/p2p-uno-game-android-wysth6')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: UNO P2P — debug APK (latest)
          prerelease: true
          body: |
            Auto-built **debug** APK from the latest commit on the development branch.
            Install with `adb install -r uno-p2p-debug.apk`, or open it on-device with
            "install from unknown sources" enabled. LAN play only — see NETWORKING.md.
          files: dist/uno-p2p-debug.apk
