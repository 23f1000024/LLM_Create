name: Android CI

# Builds run on GitHub-hosted Ubuntu runners, which ship the Android SDK and can
# reach Google's Maven — so the APK that cannot be produced in the authoring
# sandbox is built and uploaded here as a downloadable artifact.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: # lets you trigger a build manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run engine tests
        run: ./gradlew :engine:test --no-daemon
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-report
          path: engine/build/reports/tests/test
          if-no-files-found: ignore

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: engine-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uno-p2p-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
